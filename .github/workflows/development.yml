      - name: Copy .env file to VM
        run: |
          scp -o StrictHostKeyChecking=no .env.extinteractionmodule adminuser@${{ secrets.DEVELOPMENT_BACKEND_VM_HOST }}:/tmp/
        working-directory: ext-interaction-module
      - name: SSH into VM and deploy
        run: |
          ssh -o StrictHostKeyChecking=no adminuser@${{ secrets.DEVELOPMENT_BACKEND_VM_HOST }} << 'EOF'
            sudo -s
            cd /app/backend

            # Ensure docker-compose.yml exists
            if [ ! -f "docker-compose.yml" ]; then
              echo "docker-compose.yml not found!"
              exit 1
            fi
            
            # Move .env file with sudo
            sudo mv /tmp/.env.extinteractionmodule /app/backend/.env.extinteractionmodule
            echo ".env file moved successfully!"
          
            # Update only the ext-interaction-module image tag
            echo "Updating docker-compose.yml..."
            # sed -i 's|image:.*ext-interaction-module:.*|image: ${{ secrets.DEVELOPMENT_ACR_LOGIN_SERVER }}/ext-interaction-module:${{ env.IMAGE_TAG }}|' docker-compose.yml
            sed -i '/^\s*image:.*\/ext-interaction-module:/c\    image: '"${{ secrets.DEVELOPMENT_ACR_LOGIN_SERVER }}"'/ext-interaction-module:${{ env.IMAGE_TAG }}' docker-compose.yml
            echo "Docker Compose updated successfully!"
          
            # Login to ACR 
            az acr login --name ${{ secrets.DEVELOPMENT_ACR_NAME }}
            echo "Logged in to ACR successfully!"
          
            # Pull latest changes and restart
            if docker compose up -d --pull always --no-deps ext-interaction-module; then
              echo "Deployment successful!"
              # Remove old stopped containers
              docker container prune -f || true
              # Remove unused images (keeps only the latest deployed version)
              docker image prune -af || true
            else
              echo "Deployment failed!"
              exit 1
            fi
          EOF