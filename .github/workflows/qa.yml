          AZURE_TENANT_ID=${{ secrets.CERTAINTI_AZURE_TENANT_ID }}
          AZURE_CLIENT_ID=${{secrets.CERTAINTI_AZURE_CLIENT_ID}}
          AZURE_CLIENT_SECRET=${{secrets.CERTAINTI_AZURE_CLIENT_SECRET}}
          CLIENT_SECRET_ENCRYPTION_KEY=client-secret-encryption-key
          EOF
          echo "$ENV_FILE file created successfully!"
      - name: Copy .env file to VM
        run: |
          scp -o StrictHostKeyChecking=no .env.accountmodule adminuser@${{ secrets.QA_BACKEND_VM_HOST }}:/tmp/
        working-directory: account-module
      - name: SSH into VM and deploy
        run: |
          ssh -o StrictHostKeyChecking=no adminuser@${{ secrets.QA_BACKEND_VM_HOST }} << 'EOF'
            sudo -s
            cd /app/backend

            # Ensure docker-compose.yml exists
            if [ ! -f "docker-compose.yml" ]; then
              echo "docker-compose.yml not found!"
              exit 1
            fi
            
            # Move .env file with sudo
            sudo mv /tmp/.env.accountmodule /app/backend/.env.accountmodule
            echo ".env file moved successfully!"
          
            # Update only the account-module image tag
            echo "Updating docker-compose.yml..."
            sed -i 's|image:.*account-module:.*|image: ${{ secrets.QA_ACR_LOGIN_SERVER }}/account-module:${{ env.IMAGE_TAG }}|' docker-compose.yml
            echo "Docker Compose updated successfully!"
          
            # Login to ACR 
            az acr login --name ${{ secrets.QA_ACR_NAME }}
            echo "Logged in to ACR successfully!"
          
            # Pull latest changes and restart
            if docker compose up -d --pull always --no-deps account-module; then
              echo "Deployment successful!"
