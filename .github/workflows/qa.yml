name: Deploy thinkrd365 QA Backend Services

on:
  push:
    branches:
      - uat
    paths:
      - user-module/**
      - account-module/**
      - entity-module/**
      - interaction-module/**
      - ext-interaction-module/**
      - event-stream-module/**
      - case-module/** 
      - rule-builder-module/**  

env:
  ENVIRONMENT: qa

jobs:
  # JOB to run change detection
  changes:
    runs-on: ubuntu-latest
    # Set job outputs to values from filter step
    outputs:
      user-module: ${{ steps.filter.outputs.user-module }}
      account-module: ${{ steps.filter.outputs.account-module }}
      entity-module: ${{ steps.filter.outputs.entity-module }}
      interaction-module: ${{ steps.filter.outputs.interaction-module }}
      ext-interaction-module: ${{ steps.filter.outputs.ext-interaction-module }}
      event-stream-module: ${{ steps.filter.outputs.event-stream-module }}
      case-module: ${{ steps.filter.outputs.case-module }}
      rule-builder-module: ${{ steps.filter.outputs.rule-builder-module }}
    # For pull requests it's not necessary to checkout the code
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            user-module:
              - 'user-module/**'
            account-module:
              - 'account-module/**'
            entity-module:
              - 'entity-module/**'
            interaction-module:
              - 'interaction-module/**'
            ext-interaction-module:
              - 'ext-interaction-module/**'
            event-stream-module:
              - 'event-stream-module/**' 
            case-module:
              - 'case-module/**'
            rule-builder-module:
              - 'rule-builder-module/**'

  # JOB to build backend user-module code
  user-module:
    needs: changes
    if: ${{ needs.changes.outputs.user-module == 'true' }}
    name: Build and Deploy User Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Up Tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Login to ACR
        run: az acr login --name ${{ secrets.QA_ACR_NAME }}
        working-directory: user-module
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.QA_ACR_LOGIN_SERVER }}/user-module:${{ env.IMAGE_TAG }} .
        working-directory: user-module
      - name: Push Docker Image to ACR
        run: docker push ${{ secrets.QA_ACR_LOGIN_SERVER }}/user-module:${{ env.IMAGE_TAG }}
        working-directory: user-module

      - name: Cleanup old Docker tags in ACR (keep latest 10)
        run: |
          ACR_NAME=${{ secrets.QA_ACR_NAME }}
          REPO_NAME="user-module"
          KEEP_LATEST=10

          echo "Cleaning up old tags for $REPO_NAME (keeping latest $KEEP_LATEST)..."

          # List tags sorted by last update descending and skip the latest $KEEP_LATEST
          tags_to_delete=$(az acr repository show-tags --name "$ACR_NAME" --repository "$REPO_NAME" --orderby time_desc --output tsv | tail -n +$((KEEP_LATEST + 1)))

          if [ -z "$tags_to_delete" ]; then
            echo "No old tags to delete."
          else
            for tag in $tags_to_delete; do
              echo "Deleting $REPO_NAME:$tag"
              az acr repository delete --name "$ACR_NAME" --image "$REPO_NAME:$tag" --yes
            done
          fi

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.QA_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.QA_BACKEND_VM_HOST }} >> ~/.ssh/known_hosts
      - name: Fetch secrets and create .env file
        working-directory: user-module
        run: |
          KEY_VAULT_NAME=${{ secrets.QA_KEY_VAULT_NAME }}
          ENV_FILE=".env.usermodule"
          
          # Ensure Azure CLI is authenticated
          az account show > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "Error: Azure CLI is not authenticated. Run 'az login' first."
            exit 1
          fi
          
          # Fetch secrets from Azure Key Vault and write to .env file
          echo "Fetching secrets from Azure Key Vault: $KEY_VAULT_NAME"
          
          KEY_VAULT_URI=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "key-vault-uri" --query value -o tsv)
          API_CLIENT_ID=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "b2c-tenant-api-client-id" --query value -o tsv)
          API_CLIENT_SECRET=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "b2c-tenant-api-client-secret" --query value -o tsv)
          API_TENANT_ID=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "b2c-tenant-api-tenant-id" --query value -o tsv)
          API_TENANT_DOMAIN=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "b2c-tenant-domain" --query value -o tsv)
          MAIL_CLIENT_SECRET=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "mail-app-client-secret" --query value -o tsv)
          MAIL_CLIENT_ID=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "mail-app-client-id" --query value -o tsv)
          MAIL_TENANT_ID=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "mail-app-tenant-id" --query value -o tsv)
          
          # Write secrets to .env file
          cat <<EOF > $ENV_FILE
          SERVER_PORT=5000
          KEY_VAULT_URI=$KEY_VAULT_URI
          AZURE_B2C_TENANT=$API_TENANT_DOMAIN
          AZURE_B2C_CLIENT_SECRET=$API_CLIENT_SECRET
          AZURE_B2C_CLIENT_ID=$API_CLIENT_ID
          AZURE_B2C_TENANT_ID=$API_TENANT_ID
          AZURE_SCOPE=https://graph.microsoft.com/.default
          AZURE_STORAGE_CONNECTION_STRING="storage-account-connection-string"
          MAINDB_NAME=main-database-name
          MAINDB_PASSWORD=main-db-admin-password
          MAINDB_USERNAME=main-db-admin-username
          MAINDB_ENDPOINT=main-db-endpoint
          MAIL_TENANT_ID=$MAIL_TENANT_ID
          MAIL_CLIENT_ID=$MAIL_CLIENT_ID
          MAIL_CLIENT_SECRET=$MAIL_CLIENT_SECRET
          EMAIL_FROM=interactions@certainti.ai
          LOGIN_URL=https://thinkrd365-qa.certainti.ai
          SUPPORT_EMAIL=support@certainti.ai
          LOG_LEVEL=debug
          NODE_ENV=QA
          NODE_ENV_DB_PREFIX="U001-"
          EMAIL_WEBHOOK_URL='https://qa-thinkrd365-api-management.azure-api.net/interactionService/api/email/webhook'
          CLIENT_SECRET_ENCRYPTION_KEY='client-secret-encryption-key'
          CLIENT_SECRET_ENCRYPTION_LENGTH=16
          AZURE_CONTAINER_NAME="user"
          AZURE_WEB_PUBSUB_CONNECTION_STRING=Endpoint=https://qa-thinkrd365-websockets.webpubsub.azure.com;AccessKey=A6x0M5JBWz0S5iAXXrDljBufMXhw65EN3mP6AIztJ1tWT7Y9OTWFJQQJ99BLACYeBjFXJ3w3AAAAAWPSzgtU;Version=1.0;
          EOF
          echo "$ENV_FILE file created successfully!"
          ls -la
      - name: Copy .env file to VM
        run: |
          scp -v -o StrictHostKeyChecking=no .env.usermodule adminuser@${{ secrets.QA_BACKEND_VM_HOST }}:/tmp/
        working-directory: user-module
      - name: SSH into VM and deploy
        run: |
          ssh -o StrictHostKeyChecking=no adminuser@${{ secrets.QA_BACKEND_VM_HOST }} << 'EOF'
            sudo -s
            cd /app/backend

            # Ensure docker-compose.yml exists
            if [ ! -f "docker-compose.yml" ]; then
              echo "docker-compose.yml not found!"
              exit 1
            fi
          
            # Move .env file with sudo
            sudo mv /tmp/.env.usermodule /app/backend/.env.usermodule
            echo ".env file moved successfully!"
            
            # Update only the usermodule image tag
            echo "Updating docker-compose.yml..."
            sed -i 's|image:.*user-module:.*|image: ${{ secrets.QA_ACR_LOGIN_SERVER }}/user-module:${{ env.IMAGE_TAG }}|' docker-compose.yml
            echo "Docker Compose updated successfully!"
            
            # Login to ACR 
            az acr login --name ${{ secrets.QA_ACR_NAME }}
            echo "Logged in to ACR successfully!"
            
            # Pull latest changes and restart
            if docker compose up -d --pull always --no-deps user-module; then
              echo "Deployment successful!"
              # Remove old stopped containers
              docker container prune -f || true
              # Remove unused images (keeps only the latest deployed version)
              docker image prune -af || true
            else
              echo "Deployment failed!"
              exit 1
            fi
          EOF

  # JOB to build backend account-module code
  account-module:
    needs:
      - changes
    if: ${{ needs.changes.outputs.account-module == 'true' }}
    name: Build and Deploy Account Module
    runs-on: ubuntu-latest
