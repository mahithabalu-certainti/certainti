# ============ SFTP CONFIGURATION ============
sftp.folders=resource,resource_cost,resource_skill,project,project_resource,project_task,timesheet
sftp.file.types=csv,xlsx,xls
sftp.scheduler=quartz
sftp.stepwise=false
sftp.delete.after.download=true
sftp.move.failed=error
sftp.known.hosts=/known_hosts
sftp.strict.host.check=no
sftp.max.reconnect=3
sftp.binary=false

# ============ LOGGING ============
logging.config=classpath:logback.xml
logging.exception-conversion-word=%wEx
logging.level.org.apache.camel=DEBUG
logging.level.com.jcraft.jsch=DEBUG
logging.level.com.azure.core=DEBUG
logging.level.reactor.netty=DEBUG

# ============ APPLICATION SETTINGS ============
server.port=8081

# ============ PYTHON INTEGRATION ============
python.api.url=${PYTHON_API_URL}

# ============ DEFAULT UUIDS ============
document.default.related_to=account
import.default.uploaded_by_user_rid=${UPLOADED_BY_USER_ID}

# Azure Blob Storage Configuration
azure.blob.connection-string=storage-account-connection-string

error.max.retries=3
error.retry.delay.ms=5000
# Azure Key Vault Configuration (leave KEY_VAULT_URI unset locally to disable Key Vault and use env vars directly)
azure.keyvault.uri=${KEY_VAULT_URI:}

# Database Configuration (fallbacks for when Key Vault is unavailable)
maindb.name=${MAINDB_NAME:main-database-name}
maindb.username=${MAINDB_USERNAME:main-db-admin-username}
maindb.password=${MAINDB_PASSWORD:main-db-admin-password}
maindb.endpoint=${MAINDB_ENDPOINT:main-db-endpoint}
maindb.port=${MAINDB_PORT:5432}
schedule.cron.secret-name=sftp-cron-expression